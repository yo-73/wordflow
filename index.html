<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WordFlow">
<meta name="description" content="英検準1級からTOEFLまで。スワイプで覚える自分だけの英単語帳。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>WordFlow v4 — 自分の英単語帳</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar">
    <div class="brand"><span class="brand-symbol">↗</span><span>wordflow<span class="brand-period">.</span></span></div>
    <span class="header-note" id="header-note">通学時間を、積み重ねに。</span>
  </header>
  <main id="main" aria-live="polite">
    <div class="loading"><div class="spinner"></div> 単語データを準備しています…</div>
  </main>
  <nav class="bottom-nav" id="bottomNav" aria-label="メインメニュー">
    <button data-nav="home" class="nav-item active"><span class="nav-icon">⌂</span><span>ホーム</span></button>
    <button data-nav="review" class="nav-item"><span class="nav-icon">↺</span><span>復習</span></button>
    <button data-nav="library" class="nav-item"><span class="nav-icon">▤</span><span>単語帳</span></button>
    <button data-nav="settings" class="nav-item"><span class="nav-icon">⚙</span><span>設定</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="./app.js" defer></script>
</body>
</html>
